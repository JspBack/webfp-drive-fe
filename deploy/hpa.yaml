apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webfp-fe
  namespace: webfp
  labels:
    app: webfp-fe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: webfp-fe
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
