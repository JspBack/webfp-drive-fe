name: versioning

on:
  push:
    branches: [stable]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: lint
        run: biome ci .

      - name: build
        run: pnpm build

      - name: bump and tag
        id: bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEW=v0.0.1
          else
            NEW=v$(echo "$LATEST" | cut -d. -f1 | tr -d v).$(echo "$LATEST" | cut -d. -f2).$(($(echo "$LATEST" | cut -d. -f3)+1))
          fi
          git tag "$NEW" && git push --tags
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    runs-on: ubuntu-latest
    env:
      REGION: europe-west1
      REPO: webfp
      IMAGE: webfp-fe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ needs.tag.outputs.version }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/webfp/webfp-fe
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: webfp
          location: europe-west1

      - name: Rolling deploy to GKE
        run: make deploy-gke

      - name: Keep last 3 images
        run: |
          gcloud artifacts docker images list "$IMAGE" --include-tags --format='json(version,createTime,tags)' > /tmp/images.json
          jq -r '[.[] | select((.tags // []) | length > 0)] | sort_by(.createTime) | reverse | .[3:] | .[].version' /tmp/images.json > /tmp/old-images.txt
          CUTOFF=$(jq -r '[.[] | select((.tags // []) | length > 0)] | sort_by(.createTime) | reverse | .[2].createTime // ""' /tmp/images.json)
          jq -r --arg cutoff "$CUTOFF" 'select($cutoff != "") | .[] | select(((.tags // []) | length) == 0 and .createTime <= $cutoff) | .version' /tmp/images.json > /tmp/orphans.txt
          sed "s|^|$IMAGE@|" /tmp/old-images.txt | xargs -r -I{} gcloud artifacts docker images delete --delete-tags --quiet {}
          sed "s|^|$IMAGE@|" /tmp/orphans.txt | xargs -r -I{} gcloud artifacts docker images delete --quiet {} || true
