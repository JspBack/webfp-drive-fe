apiVersion: v1
kind: Service
metadata:
  name: webfp-fe
  namespace: webfp
  labels:
    app: webfp-fe
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "webfp-fe-be"}'
spec:
  type: ClusterIP
  selector:
    app: webfp-fe
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
